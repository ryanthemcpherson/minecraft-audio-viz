name: Paper Plugin Candidate

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact current main commit to package
        required: true
        type: string

permissions: {}

concurrency:
  group: paper-plugin-candidate
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify exact main and required runs
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}

      - name: Verify exact current main
        env:
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          if [[ ! "$INPUT_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be a lowercase 40-character Git SHA"
            exit 1
          fi
          git fetch --no-tags origin main
          test "$INPUT_COMMIT_SHA" = "$GITHUB_SHA"
          test "$INPUT_COMMIT_SHA" = "$(git rev-parse origin/main)"

      - name: Require successful exact-SHA CI and security runs
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          require_successful_push_run() {
            workflow_file="$1"
            successful_runs="$(
              gh api --method GET \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs" \
                -f head_sha="$INPUT_COMMIT_SHA" \
                -f event=push \
                -f status=success \
                -f per_page=100 \
                --jq '.total_count'
            )"
            if [[ "$successful_runs" -lt 1 ]]; then
              echo "No successful push run for ${workflow_file} at ${INPUT_COMMIT_SHA}"
              exit 1
            fi
          }
          require_successful_push_run ci.yml
          require_successful_push_run security.yml

  build-attest:
    name: Build, attest, and retain candidate
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install VJ server
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "vj_server/[full]"

      - name: Set reproducible build timestamp
        run: |
          source_commit_sha="$(git rev-list --max-parents=0 HEAD)"
          [[ "$source_commit_sha" =~ ^[0-9a-f]{40}$ ]]
          source_date_epoch="$(git show -s --format=%ct "$source_commit_sha")"
          [[ "$source_date_epoch" =~ ^[0-9]+$ ]]
          echo "SOURCE_DATE_EPOCH=$source_date_epoch" >> "$GITHUB_ENV"

      - name: Build twice and compare bytes
        run: |
          first_build="$RUNNER_TEMP/mcav-paper-first.jar"
          second_build="$RUNNER_TEMP/mcav-paper-second.jar"
          ./minecraft_plugin/mvnw -f minecraft_plugin/pom.xml -B clean package \
            -Dproject.build.outputTimestamp="$SOURCE_DATE_EPOCH"
          cp minecraft_plugin/target/mcav-paper-1.1.0.jar "$first_build"
          ./minecraft_plugin/mvnw -f minecraft_plugin/pom.xml -B clean package \
            -Dproject.build.outputTimestamp="$SOURCE_DATE_EPOCH"
          cp minecraft_plugin/target/mcav-paper-1.1.0.jar "$second_build"
          sha256sum "$first_build" "$second_build"
          cmp --silent "$first_build" "$second_build"

      - name: Stage JAR, SBOM, checksums, and manifest
        run: |
          staging="$RUNNER_TEMP/paper-plugin-candidate-1.1.0"
          mkdir -p "$staging"
          cp "$RUNNER_TEMP/mcav-paper-first.jar" "$staging/mcav-paper-1.1.0.jar"
          ./minecraft_plugin/mvnw -f minecraft_plugin/pom.xml -B \
            org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom \
            -DoutputFormat=json -DoutputName=mcav-paper-1.1.0.cdx
          cp minecraft_plugin/target/mcav-paper-1.1.0.cdx.json \
            "$staging/mcav-paper-1.1.0.cdx.json"
          (
            cd "$staging"
            sha256sum mcav-paper-1.1.0.jar mcav-paper-1.1.0.cdx.json > SHA256SUMS.txt
          )
          python scripts/release/create_candidate_manifest.py \
            --version 1.1.0 \
            --artifact "$staging/mcav-paper-1.1.0.jar" \
            --sbom "$staging/mcav-paper-1.1.0.cdx.json" \
            --soak-evidence docs/superpowers/reports/2026-08-15-paper-26-2-reference-machine.md \
            --output "$staging/candidate-manifest.json"

      - name: Install exact candidate for probe compilation
        run: |
          ./minecraft_plugin/mvnw -B \
            org.apache.maven.plugins:maven-install-plugin:3.1.1:install-file \
            -Dfile="$RUNNER_TEMP/paper-plugin-candidate-1.1.0/mcav-paper-1.1.0.jar" \
            -DpomFile=minecraft_plugin/pom.xml

      - name: Build integration probe
        run: ./minecraft_plugin/mvnw -f scripts/release/probe/pom.xml -B package

      - name: Verify candidate on real Paper 26.2
        run: |
          python scripts/release/paper_e2e.py \
            --plugin "$RUNNER_TEMP/paper-plugin-candidate-1.1.0/mcav-paper-1.1.0.jar" \
            --report build/reports/paper-e2e.json

      - name: Materialize final candidate bundle
        run: |
          mkdir candidate
          cp "$RUNNER_TEMP/paper-plugin-candidate-1.1.0/"* candidate/
          cp LICENSE candidate/LICENSE
          cp build/reports/paper-e2e.json candidate/paper-e2e.json

      - name: Attest candidate JAR and SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            candidate/mcav-paper-1.1.0.jar
            candidate/mcav-paper-1.1.0.cdx.json

      - name: Upload retained candidate bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: paper-plugin-candidate-1.1.0
          path: candidate/
          if-no-files-found: error
          retention-days: 90
