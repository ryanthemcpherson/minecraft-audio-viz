name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # Verify both blocking gates passed on this commit before releasing.
  # ---------------------------------------------------------------------------
  ci-gate:
    name: Verify CI Status
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require tagged commit on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "ERROR: tagged commit $GITHUB_SHA is not reachable from origin/main."
            exit 1
          fi

      - name: Require successful workflow runs for the exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for WORKFLOW_SPEC in \
            "ci.yml:.github/workflows/ci.yml" \
            "security.yml:.github/workflows/security.yml"; do
            IFS=: read -r WORKFLOW_FILE EXPECTED_WORKFLOW_PATH <<< "$WORKFLOW_SPEC"
            WORKFLOW_METADATA=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}")
            WORKFLOW_ID=$(jq -r '.id' <<< "$WORKFLOW_METADATA")
            WORKFLOW_PATH=$(jq -r '.path' <<< "$WORKFLOW_METADATA")

            if [ "$WORKFLOW_PATH" != "$EXPECTED_WORKFLOW_PATH" ]; then
              echo "ERROR: ${WORKFLOW_FILE} resolved to ${WORKFLOW_PATH}, not ${EXPECTED_WORKFLOW_PATH}."
              exit 1
            fi

            WORKFLOW_RUNS=$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_ID}/runs" \
              -f head_sha="$GITHUB_SHA" \
              -f branch=main \
              -f status=completed \
              -f per_page=100)
            MATCHING_RUNS=$(jq \
              --arg sha "$GITHUB_SHA" \
              --arg workflow_path "$EXPECTED_WORKFLOW_PATH" \
              '[.workflow_runs[] | select(
                .head_sha == $sha and
                .head_branch == "main" and
                .path == $workflow_path and
                .event == "push" and
                .status == "completed" and
                .conclusion == "success"
              )] | length' <<< "$WORKFLOW_RUNS")

            if [ "$MATCHING_RUNS" -lt 1 ]; then
              echo "ERROR: no successful ${EXPECTED_WORKFLOW_PATH} push run exists for main commit ${GITHUB_SHA}."
              exit 1
            fi
            echo "${EXPECTED_WORKFLOW_PATH} passed with exact main-branch provenance for ${GITHUB_SHA}."
          done

  build-mod:
    name: Build Minecraft Mod
    needs: [ci-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build with Gradle
        working-directory: minecraft_mod
        run: ./gradlew build

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: minecraft-mod
          path: minecraft_mod/build/libs/audioviz-mod-*.jar
          if-no-files-found: error

  build-plugin:
    name: Build Minecraft Plugin
    needs: [ci-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: minecraft_plugin
        run: ./mvnw package -q

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: minecraft-plugin
          path: |
            minecraft_plugin/target/audioviz-plugin-*.jar
            !minecraft_plugin/target/original-*.jar
          if-no-files-found: error

  build-pterodactyl:
    name: Build Pterodactyl Bundle
    needs: [build-plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore portable runtime cache
        uses: actions/cache@v4
        with:
          path: deploy/pterodactyl/.cache
          key: pterodactyl-runtimes-${{ runner.os }}-${{ hashFiles('deploy/pterodactyl/runtime-lock.json') }}

      - name: Download Plugin artifact
        uses: actions/download-artifact@v8
        with:
          name: minecraft-plugin
          path: plugin/

      - name: Test Pterodactyl packager
        run: bash deploy/pterodactyl/test-build-release.sh

      - name: Build and verify Pterodactyl bundle
        run: |
          set -euo pipefail
          python -m venv vj_server/.venv
          mapfile -d '' -t PLUGIN_JARS < <(
            find plugin -maxdepth 1 -type f -name 'audioviz-plugin-*.jar' ! -name '*-shaded.jar' -print0
          )
          if [ "${#PLUGIN_JARS[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly one plugin JAR, found ${#PLUGIN_JARS[@]}."
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          bash deploy/pterodactyl/build-release.sh \
            --version "$VERSION" \
            --plugin-jar "${PLUGIN_JARS[0]}" \
            --output-dir dist

      - name: Cross-check Pterodactyl bundle with PowerShell verifier
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem -LiteralPath dist -Filter 'mcav-pterodactyl-*.zip')
          if ($archives.Count -ne 1) {
            throw "Expected exactly one Pterodactyl archive, found $($archives.Count)."
          }
          ./deploy/pterodactyl/verify-release.ps1 -Archive $archives[0].FullName

      - name: Upload Pterodactyl bundle
        uses: actions/upload-artifact@v7
        with:
          name: pterodactyl-bundle
          path: |
            dist/mcav-pterodactyl-*.zip
            dist/mcav-pterodactyl-*.zip.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create Release
    needs: [build-mod, build-plugin, build-pterodactyl]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download Mod artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: minecraft-mod
          path: mod/

      - name: Download Plugin artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: minecraft-plugin
          path: plugin/

      - name: Download Pterodactyl bundle
        uses: actions/download-artifact@v8
        with:
          name: pterodactyl-bundle
          path: pterodactyl/

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: List artifacts
        run: |
          echo "=== Minecraft mod ==="
          ls -la mod/
          echo "=== Minecraft plugin ==="
          ls -la plugin/
          echo "=== Pterodactyl bundle ==="
          ls -la pterodactyl/

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Release ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            mod/*.jar
            plugin/*.jar
            pterodactyl/*.zip
            pterodactyl/*.zip.sha256
