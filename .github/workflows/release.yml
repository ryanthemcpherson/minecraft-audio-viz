name: Release

on:
  push:
    tags: ['v*']

permissions:
  checks: read
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Verify both blocking gates passed on this commit before releasing.
  # ---------------------------------------------------------------------------
  ci-gate:
    name: Verify CI Status
    runs-on: ubuntu-latest
    steps:
      - name: Check required statuses for commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${GITHUB_SHA}"
          echo "Checking required statuses for commit ${SHA}..."
          for REQUIRED_CHECK in "CI Passed" "Security Summary"; do
            CONCLUSION=$(gh api "repos/${{ github.repository }}/commits/${SHA}/check-runs?per_page=100" \
              --jq "[.check_runs[] | select(.name == \"${REQUIRED_CHECK}\")] | first | .conclusion // \"not_found\"")
            if [ "$CONCLUSION" != "success" ]; then
              echo "ERROR: ${REQUIRED_CHECK} has not passed on this commit (status: ${CONCLUSION})."
              exit 1
            fi
            echo "${REQUIRED_CHECK} passed on commit ${SHA}."
          done

  build-mod:
    name: Build Minecraft Mod
    needs: [ci-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build with Gradle
        working-directory: minecraft_mod
        run: ./gradlew build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: minecraft-mod
          path: minecraft_mod/build/libs/audioviz-mod-*.jar
          if-no-files-found: error

  build-plugin:
    name: Build Minecraft Plugin
    needs: [ci-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: minecraft_plugin
        run: ./mvnw package -q

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: minecraft-plugin
          path: |
            minecraft_plugin/target/audioviz-plugin-*.jar
            !minecraft_plugin/target/original-*.jar
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build-mod, build-plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Mod artifacts
        uses: actions/download-artifact@v8
        with:
          name: minecraft-mod
          path: mod/

      - name: Download Plugin artifacts
        uses: actions/download-artifact@v8
        with:
          name: minecraft-plugin
          path: plugin/

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: List artifacts
        run: |
          echo "=== Minecraft mod ==="
          ls -la mod/
          echo "=== Minecraft plugin ==="
          ls -la plugin/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            mod/*.jar
            plugin/*.jar
