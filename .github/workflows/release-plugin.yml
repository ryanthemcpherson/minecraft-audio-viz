name: Release Minecraft Plugin

# Phase 0 quarantine: the no-bypass release-tag ruleset blocks tag creation.
# Keep this workflow tag-only so historical refs cannot be manually dispatched.
on:
  push:
    tags: ['plugin-v*']

permissions: {}

jobs:
  ci-gate:
    name: Verify CI Status
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require tagged commit on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "ERROR: tagged commit $GITHUB_SHA is not reachable from origin/main."
            exit 1
          fi

      - name: Require successful workflow runs for the exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for WORKFLOW_SPEC in \
            "ci.yml:.github/workflows/ci.yml" \
            "security.yml:.github/workflows/security.yml"; do
            IFS=: read -r WORKFLOW_FILE EXPECTED_WORKFLOW_PATH <<< "$WORKFLOW_SPEC"
            WORKFLOW_METADATA=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}")
            WORKFLOW_ID=$(jq -r '.id' <<< "$WORKFLOW_METADATA")
            WORKFLOW_PATH=$(jq -r '.path' <<< "$WORKFLOW_METADATA")

            if [ "$WORKFLOW_PATH" != "$EXPECTED_WORKFLOW_PATH" ]; then
              echo "ERROR: ${WORKFLOW_FILE} resolved to ${WORKFLOW_PATH}, not ${EXPECTED_WORKFLOW_PATH}."
              exit 1
            fi

            WORKFLOW_RUNS=$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_ID}/runs" \
              -f head_sha="$GITHUB_SHA" \
              -f branch=main \
              -f status=completed \
              -f per_page=100)
            MATCHING_RUNS=$(jq \
              --arg sha "$GITHUB_SHA" \
              --arg workflow_path "$EXPECTED_WORKFLOW_PATH" \
              '[.workflow_runs[] | select(
                .head_sha == $sha and
                .head_branch == "main" and
                .path == $workflow_path and
                .event == "push" and
                .status == "completed" and
                .conclusion == "success"
              )] | length' <<< "$WORKFLOW_RUNS")

            if [ "$MATCHING_RUNS" -lt 1 ]; then
              echo "ERROR: no successful ${EXPECTED_WORKFLOW_PATH} push run exists for main commit ${GITHUB_SHA}."
              exit 1
            fi
            echo "${EXPECTED_WORKFLOW_PATH} passed with exact main-branch provenance for ${GITHUB_SHA}."
          done

  build:
    name: Build Paper Plugin
    needs: [ci-gate]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: minecraft_plugin
        run: ./mvnw package -q

      - name: Run tests
        working-directory: minecraft_plugin
        run: ./mvnw test -q

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: minecraft-plugin
          path: minecraft_plugin/target/audioviz-plugin-*.jar
          # Exclude the original (unshaded) JAR
          exclude: minecraft_plugin/target/original-*.jar
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build]
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "VERSION=${TAG#plugin-v}" >> "$GITHUB_OUTPUT"
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Download plugin artifact
        uses: actions/download-artifact@v8
        with:
          name: minecraft-plugin
          path: plugin/

      - name: Remove original (unshaded) JAR
        run: rm -f plugin/original-*.jar

      - name: Generate checksums
        run: |
          cd plugin
          sha256sum *.jar > SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: MCAV Paper Plugin ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'alpha') || contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'rc') }}
          body: |
            ## MCAV Paper Plugin ${{ steps.version.outputs.VERSION }}

            Minecraft 1.21.11 | Paper/Spigot | Java 21

            ### Requirements
            - [Paper](https://papermc.io/downloads/paper) 1.21.11+ (or Spigot/Purpur)
            - Java 21

            ### Optional
            - [Simple Voice Chat](https://modrinth.com/mod/simple-voice-chat) for DJ audio relay

            ### Installation
            Drop the `.jar` into your server's `plugins/` folder.
          files: |
            plugin/*.jar
            plugin/SHA256SUMS.txt
