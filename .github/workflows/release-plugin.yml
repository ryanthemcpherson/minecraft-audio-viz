name: Release Minecraft Plugin

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Paper candidate workflow run ID
        required: true
        type: string
      commit_sha:
        description: Exact current main commit represented by the candidate
        required: true
        type: string
      version:
        description: Plugin release version
        required: true
        type: string
      sha256:
        description: Expected lowercase SHA-256 of mcav-paper-1.1.0.jar
        required: true
        type: string

permissions: {}

concurrency:
  group: paper-plugin-release
  cancel-in-progress: false

jobs:
  verify-candidate:
    name: Verify candidate provenance
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}

      - name: Validate immutable release inputs
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$VERSION" = "1.1.0"

      - name: Require exact current main and absent release tag
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          git fetch --no-tags origin main
          test "$COMMIT_SHA" = "$GITHUB_SHA"
          test "$COMMIT_SHA" = "$(git rev-parse origin/main)"
          set +e
          git ls-remote --exit-code --tags origin refs/tags/plugin-v1.1.0
          tag_status=$?
          set -e
          if [[ "$tag_status" -eq 0 ]]; then
            echo "refs/tags/plugin-v1.1.0 already exists"
            exit 1
          fi
          if [[ "$tag_status" -ne 2 ]]; then
            echo "Unable to verify release-tag absence"
            exit "$tag_status"
          fi

      - name: Require successful candidate workflow provenance
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          candidate_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}")"
          jq -e --arg commit_sha "$COMMIT_SHA" '
            .head_sha == $commit_sha and
            .event == "workflow_dispatch" and
            .status == "completed" and
            .conclusion == "success" and
            (.path | startswith(".github/workflows/paper-candidate.yml"))
          ' <<< "$candidate_run"

      - name: Download retained candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: paper-plugin-candidate-1.1.0
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Verify candidate manifest and checksums
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
          VERSION: ${{ inputs.version }}
        run: |
          test "$(jq -r '.commit_sha' candidate/candidate-manifest.json)" = "$COMMIT_SHA"
          test "$(jq -r '.version' candidate/candidate-manifest.json)" = "$VERSION"
          test "$(jq -r '.artifact.file' candidate/candidate-manifest.json)" = \
            "mcav-paper-1.1.0.jar"
          test "$(jq -r '.artifact.sha256' candidate/candidate-manifest.json)" = \
            "$EXPECTED_SHA256"
          (
            cd candidate
            sha256sum -c SHA256SUMS.txt
          )
          test "$(sha256sum candidate/mcav-paper-1.1.0.jar | cut -d ' ' -f 1)" = \
            "$EXPECTED_SHA256"

      - name: Verify GitHub attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify candidate/mcav-paper-1.1.0.jar --repo "$GITHUB_REPOSITORY"
          gh attestation verify candidate/mcav-paper-1.1.0.cdx.json --repo "$GITHUB_REPOSITORY"

      - name: Require successful exact-SHA CI and security runs
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          require_successful_push_run() {
            workflow_file="$1"
            successful_runs="$(
              gh api --method GET \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs" \
                -f head_sha="$COMMIT_SHA" \
                -f event=push \
                -f status=success \
                -f per_page=100 \
                --jq '.total_count'
            )"
            if [[ "$successful_runs" -lt 1 ]]; then
              echo "No successful push run for ${workflow_file} at ${COMMIT_SHA}"
              exit 1
            fi
          }
          require_successful_push_run ci.yml
          require_successful_push_run security.yml

  release:
    name: Create immutable Paper plugin release
    needs: [verify-candidate]
    runs-on: ubuntu-latest
    environment: plugin-release
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}

      - name: Download approved candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: paper-plugin-candidate-1.1.0
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Reverify approved bytes
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(jq -r '.commit_sha' candidate/candidate-manifest.json)" = "$COMMIT_SHA"
          test "$(jq -r '.version' candidate/candidate-manifest.json)" = "1.1.0"
          test "$(jq -r '.artifact.sha256' candidate/candidate-manifest.json)" = \
            "$EXPECTED_SHA256"
          (
            cd candidate
            sha256sum -c SHA256SUMS.txt
          )
          gh attestation verify candidate/mcav-paper-1.1.0.jar --repo "$GITHUB_REPOSITORY"
          gh attestation verify candidate/mcav-paper-1.1.0.cdx.json --repo "$GITHUB_REPOSITORY"

      - name: Create and push immutable tag
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main
          test "$COMMIT_SHA" = "$(git rev-parse origin/main)"
          set +e
          git ls-remote --exit-code --tags origin refs/tags/plugin-v1.1.0
          tag_status=$?
          set -e
          if [[ "$tag_status" -eq 0 ]]; then
            echo "refs/tags/plugin-v1.1.0 already exists"
            exit 1
          fi
          if [[ "$tag_status" -ne 2 ]]; then
            echo "Unable to verify release-tag absence"
            exit "$tag_status"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          git tag -a plugin-v1.1.0 "$COMMIT_SHA" -m "MCAV Paper Plugin 1.1.0"
          git push origin refs/tags/plugin-v1.1.0

      - name: Publish byte-identical candidate files
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: plugin-v1.1.0
          name: MCAV Paper Plugin 1.1.0
          body_path: docs/releases/plugin-v1.1.0.md
          draft: false
          prerelease: false
          files: |
            candidate/mcav-paper-1.1.0.jar
            candidate/mcav-paper-1.1.0.cdx.json
            candidate/SHA256SUMS.txt
            candidate/candidate-manifest.json
            candidate/LICENSE
