name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Python: lint + test
  # ---------------------------------------------------------------------------
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install "ruff>=0.1.0,<1"

      - name: Ruff check
        run: ruff check vj_server/

      - name: Ruff format check
        run: ruff format --check vj_server/

  # ---------------------------------------------------------------------------
  # Python: security static analysis (Bandit)
  # ---------------------------------------------------------------------------
  python-sast:
    name: Python SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run Bandit
        run: |
          set +e
          bandit -r vj_server/ -c pyproject.toml -f json -o bandit-report.json
          audit_status=$?
          set -e
          if [ -f bandit-report.json ]; then
            cat bandit-report.json
          fi
          exit "$audit_status"

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bandit-report-${{ github.sha }}
          path: bandit-report.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Python: dependency audit (pip-audit)
  # ---------------------------------------------------------------------------
  python-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "vj_server/[full]" -e "coordinator/[dev]" pip-audit

      - name: Run pip-audit
        run: |
          set +e
          pip-audit --desc --local --format json --output pip-audit-report.json
          audit_status=$?
          set -e
          if [ -f pip-audit-report.json ]; then
            cat pip-audit-report.json
          fi
          exit "$audit_status"

      - name: Install community_bot audit dependencies
        if: always()
        run: |
          python -m venv .audit-venvs/community-bot
          .audit-venvs/community-bot/bin/python -m pip install --upgrade pip
          .audit-venvs/community-bot/bin/python -m pip install -e "./community_bot[dev]" pip-audit

      - name: Audit community_bot package
        if: always()
        run: |
          set +e
          .audit-venvs/community-bot/bin/python -m pip_audit --desc --local --format json --output community-bot-pip-audit-report.json
          audit_status=$?
          set -e
          if [ -f community-bot-pip-audit-report.json ]; then
            cat community-bot-pip-audit-report.json
          fi
          exit "$audit_status"

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pip-audit-report-${{ github.sha }}
          path: |
            pip-audit-report.json
            community-bot-pip-audit-report.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Java: build Fabric mod
  # ---------------------------------------------------------------------------
  java-build:
    name: Java Build (Fabric Mod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build with Gradle
        working-directory: minecraft_mod
        run: ./gradlew build

      - name: Upload mod JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: audioviz-mod-${{ github.sha }}
          path: minecraft_mod/build/libs/audioviz-mod-*.jar
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Java: build Paper plugin
  # ---------------------------------------------------------------------------
  java-plugin-build:
    name: Java Build (Paper Plugin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Build with Maven
        working-directory: minecraft_plugin
        run: ./mvnw package -q

      - name: Run tests with coverage
        working-directory: minecraft_plugin
        run: ./mvnw test -q

      - name: Generate JaCoCo coverage report
        working-directory: minecraft_plugin
        if: always()
        run: ./mvnw jacoco:report -q

      - name: Print coverage summary
        working-directory: minecraft_plugin
        if: always()
        run: |
          if [ -f target/site/jacoco/index.html ]; then
            echo "### Java Coverage Report" >> $GITHUB_STEP_SUMMARY
            echo "JaCoCo report generated at target/site/jacoco/" >> $GITHUB_STEP_SUMMARY
          fi

  # ---------------------------------------------------------------------------
  # Integration: real Paper 26.2 + VJ lifecycle
  # ---------------------------------------------------------------------------
  paper-26-2-integration:
    name: Paper 26.2 Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install VJ server
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "vj_server/[full]"

      - name: Build Paper plugin
        run: ./minecraft_plugin/mvnw -f minecraft_plugin/pom.xml install

      - name: Build integration probe
        run: ./minecraft_plugin/mvnw -f scripts/release/probe/pom.xml package

      - name: Run real Paper lifecycle
        run: |
          python scripts/release/paper_e2e.py \
            --plugin minecraft_plugin/target/mcav-paper-1.1.0.jar \
            --report build/reports/paper-e2e.json

      - name: Upload sanitized Paper report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: paper-26-2-integration-${{ github.sha }}
          path: build/reports/paper-e2e.json
          retention-days: 30
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Next.js: site build + lint
  # ---------------------------------------------------------------------------
  site-build:
    name: Site Build (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Lint
        working-directory: site
        run: npm run lint

      - name: Run tests
        working-directory: site
        run: npm run test --if-present

      - name: Build
        working-directory: site
        run: npm run build

  # ---------------------------------------------------------------------------
  # Coordinator: Python lint + test
  # ---------------------------------------------------------------------------
  coordinator-test:
    name: Coordinator Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install "ruff>=0.1.0,<1"

      - name: Ruff check coordinator
        run: ruff check coordinator/

      - name: Ruff format check coordinator
        run: ruff format --check coordinator/

      - name: Install coordinator dependencies
        working-directory: coordinator
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install pytest-cov
        run: pip install pytest-cov

      - name: Run coordinator tests with coverage
        working-directory: coordinator
        run: pytest tests/ -v --tb=short -p no:cacheprovider --cov=app --cov-report=term-missing --cov-fail-under=60

  # ---------------------------------------------------------------------------
  # VJ server: Python tests
  # ---------------------------------------------------------------------------
  vj-server-test:
    name: VJ Server Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install VJ dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "vj_server/[full]" pytest pytest-asyncio pytest-timeout pytest-cov

      - name: Run VJ server tests with coverage
        run: pytest vj_server/tests -v --tb=short --timeout=60 --timeout-method=signal -p no:cacheprovider --cov=vj_server --cov-report=term-missing --cov-fail-under=15

  # ---------------------------------------------------------------------------
  # Community bot: installable package + tests
  # ---------------------------------------------------------------------------
  community-bot-test:
    name: Community Bot Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install community bot dependencies
        working-directory: community_bot
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run community bot tests
        working-directory: community_bot
        run: python -m pytest tests/ -q

  # ---------------------------------------------------------------------------
  # DJ Client: Rust tests + web build
  # ---------------------------------------------------------------------------
  dj-client-test:
    name: DJ Client Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dj_client/package-lock.json

      - name: Install system dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install DJ client dependencies
        working-directory: dj_client
        run: npm ci

      - name: Build DJ client frontend
        working-directory: dj_client
        run: npm run build

      - name: Run DJ client frontend tests
        working-directory: dj_client
        run: npm test -- --watch=false

      - name: Run Rust backend tests
        working-directory: dj_client/src-tauri
        run: cargo test

  # ---------------------------------------------------------------------------
  # Cross-runtime protocol contract
  # ---------------------------------------------------------------------------
  protocol-contract:
    name: Protocol Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Run protocol schema contract
        run: node --test protocol/tests/phase0-schemas.test.mjs

  # ---------------------------------------------------------------------------
  # DJ Phase 0 distribution containment
  # ---------------------------------------------------------------------------
  dj-phase0-containment:
    name: DJ Phase 0 Containment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Verify Docker Compose
        run: docker compose version

      - name: Run Phase 0 containment contract
        run: npm --prefix dj_client run test:containment

  # ---------------------------------------------------------------------------
  # Java: OWASP dependency checks (Fabric + Paper)
  # ---------------------------------------------------------------------------
  java-audit:
    name: Fabric OWASP Dependency-Check
    runs-on: ubuntu-latest
    env:
      DEPENDENCY_CHECK_DATA_DIR: ${{ github.workspace }}/.dependency-check-data
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Restore NVD data cache
        id: nvd-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DEPENDENCY_CHECK_DATA_DIR }}
          key: owasp-dependency-check-12.2.2-${{ runner.os }}-${{ github.run_id }}-fabric
          restore-keys: |
            owasp-dependency-check-12.2.2-${{ runner.os }}-

      - name: Run Fabric OWASP Dependency-Check
        id: dependency-check
        working-directory: minecraft_mod
        run: |
          set +e
          ./gradlew dependencyCheckAnalyze
          audit_status=$?
          set -e
          if [[ -f build/reports/dependency-check/dependency-check-report.json &&
                -f build/reports/dependency-check/dependency-check-report.sarif ]]; then
            echo "reports-generated=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$audit_status"

      - name: Save NVD data cache
        if: always() && steps.dependency-check.outputs.reports-generated == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DEPENDENCY_CHECK_DATA_DIR }}
          key: ${{ steps.nvd-cache.outputs.cache-primary-key }}

      - name: Upload dependency-check reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fabric-dependency-check-${{ github.sha }}
          path: |
            minecraft_mod/build/reports/dependency-check/dependency-check-report.json
            minecraft_mod/build/reports/dependency-check/dependency-check-report.sarif
          retention-days: 30
          if-no-files-found: warn

  java-plugin-audit:
    name: Paper OWASP Dependency-Check
    runs-on: ubuntu-latest
    env:
      DEPENDENCY_CHECK_DATA_DIR: ${{ github.workspace }}/.dependency-check-data
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Restore NVD data cache
        id: nvd-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DEPENDENCY_CHECK_DATA_DIR }}
          key: owasp-dependency-check-12.2.2-${{ runner.os }}-${{ github.run_id }}-paper
          restore-keys: |
            owasp-dependency-check-12.2.2-${{ runner.os }}-

      - name: Run Paper OWASP Dependency-Check
        id: dependency-check
        working-directory: minecraft_plugin
        run: |
          nvd_args=()
          if [[ -n "${NVD_API_KEY:-}" ]]; then
            nvd_args+=("-DnvdApiKeyEnvironmentVariable=NVD_API_KEY")
          fi
          set +e
          ./mvnw -B \
            org.owasp:dependency-check-maven:12.2.2:check \
            -DfailBuildOnCVSS=0 \
            -DfailOnError=true \
            -DskipProvidedScope=true \
            -DhostedSuppressionsEnabled=false \
            -Dformats=JSON,SARIF \
            -DdataDirectory="$DEPENDENCY_CHECK_DATA_DIR" \
            -Dodc.outputDirectory=target/dependency-check \
            "${nvd_args[@]}"
          audit_status=$?
          set -e
          if [[ -f target/dependency-check/dependency-check-report.json &&
                -f target/dependency-check/dependency-check-report.sarif ]]; then
            echo "reports-generated=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$audit_status"

      - name: Save NVD data cache
        if: always() && steps.dependency-check.outputs.reports-generated == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DEPENDENCY_CHECK_DATA_DIR }}
          key: ${{ steps.nvd-cache.outputs.cache-primary-key }}

      - name: Upload dependency-check reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: paper-dependency-check-${{ github.sha }}
          path: |
            minecraft_plugin/target/dependency-check/dependency-check-report.json
            minecraft_plugin/target/dependency-check/dependency-check-report.sarif
          retention-days: 30
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Node.js: npm audit (root + dj_client)
  # ---------------------------------------------------------------------------
  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Audit root package
        run: |
          npm ci --ignore-scripts
          set +e
          npm audit --audit-level=high --json > npm-audit-root.json
          audit_status=$?
          set -e
          cat npm-audit-root.json
          exit "$audit_status"

      - name: Audit dj_client package
        if: always()
        working-directory: dj_client
        run: |
          npm ci --ignore-scripts
          set +e
          npm audit --audit-level=high --json > npm-audit-djclient.json
          audit_status=$?
          set -e
          cat npm-audit-djclient.json
          exit "$audit_status"

      - name: Audit site package
        if: always()
        working-directory: site
        run: |
          npm ci --ignore-scripts
          set +e
          npm audit --audit-level=high --json > npm-audit-site.json
          audit_status=$?
          set -e
          cat npm-audit-site.json
          exit "$audit_status"

      - name: Audit worker package
        if: always()
        working-directory: worker
        run: |
          npm ci --ignore-scripts
          set +e
          npm audit --audit-level=high --json > npm-audit-worker.json
          audit_status=$?
          set -e
          cat npm-audit-worker.json
          exit "$audit_status"

      - name: Upload npm audit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-audit-reports-${{ github.sha }}
          path: |
            npm-audit-root.json
            dj_client/npm-audit-djclient.json
            site/npm-audit-site.json
            worker/npm-audit-worker.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # License compliance check
  # ---------------------------------------------------------------------------
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e "vj_server/[full]" -e "coordinator/[dev]" pip-licenses

      - name: Python license check
        run: |
          echo "### Python Dependency Licenses" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          pip-licenses --format=markdown --with-urls >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          # Fail on copyleft licenses that are incompatible with MIT
          pip-licenses --fail-on="GPL-2.0;GPL-3.0;AGPL-3.0;LGPL-2.0;LGPL-2.1;LGPL-3.0"

      - name: Java dependency licenses
        working-directory: minecraft_mod
        run: |
          echo "### Java Dependency Licenses (Gradle)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ./gradlew dependencies --configuration runtimeClasspath >> $GITHUB_STEP_SUMMARY 2>&1
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Set up JDK 25 for Paper
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Paper dependency licenses
        working-directory: minecraft_plugin
        run: |
          echo "### Paper Dependency Licenses (Maven)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ./mvnw -B dependency:list -DincludeScope=runtime >> $GITHUB_STEP_SUMMARY 2>&1
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Rust: cargo-audit (DJ Client / Tauri)
  # ---------------------------------------------------------------------------
  rust-audit:
    name: Rust Dependency Audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo-audit
        working-directory: dj_client/src-tauri
        run: |
          set +e
          cargo audit --json > cargo-audit-report.json
          audit_status=$?
          set -e
          cat cargo-audit-report.json
          exit "$audit_status"

      - name: Upload cargo-audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cargo-audit-report-${{ github.sha }}
          path: dj_client/src-tauri/cargo-audit-report.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # SBOM generation (CycloneDX)
  # ---------------------------------------------------------------------------
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: [java-build, java-plugin-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Python deps + CycloneDX
        run: |
          python -m pip install --upgrade pip
          pip install -e "vj_server/[full]" -e "coordinator/[dev]" cyclonedx-bom

      - name: Generate Python SBOM
        run: cyclonedx-py environment -o sbom-python.json --output-format json

      - name: Set up JDK 25 for Paper
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Generate Paper SBOM
        working-directory: minecraft_plugin
        run: |
          ./mvnw -B org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom \
            -DoutputFormat=json -DoutputName=mcav-paper-1.1.0.cdx

      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom-python.json
            minecraft_plugin/target/mcav-paper-1.1.0.cdx.json
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Checksums for release artifacts
  # ---------------------------------------------------------------------------
  checksums:
    name: Generate Checksums
    runs-on: ubuntu-latest
    needs: [java-build]
    steps:
      - name: Download mod JAR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: audioviz-mod-${{ github.sha }}
          path: ./artifacts/

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          echo "### Artifact Checksums" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat SHA256SUMS.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: checksums-${{ github.sha }}
          path: artifacts/SHA256SUMS.txt
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Summary gate -- all required checks must pass
  # ---------------------------------------------------------------------------
  ci-passed:
    name: CI Passed
    if: always()
    needs: [python-lint, java-build, java-plugin-build, paper-26-2-integration, site-build, coordinator-test, vj-server-test, dj-client-test, community-bot-test, protocol-contract, dj-phase0-containment, python-sast, python-audit, java-audit, java-plugin-audit, npm-audit, rust-audit, license-check, sbom, checksums]
    runs-on: ubuntu-latest
    steps:
      - name: Check required results
        run: |
          if [[ "${{ needs.python-lint.result }}" != "success" ||
                "${{ needs.java-build.result }}" != "success" ||
                "${{ needs.java-plugin-build.result }}" != "success" ||
                "${{ needs.paper-26-2-integration.result }}" != "success" ||
                "${{ needs.site-build.result }}" != "success" ||
                "${{ needs.coordinator-test.result }}" != "success" ||
                "${{ needs.vj-server-test.result }}" != "success" ||
                "${{ needs.dj-client-test.result }}" != "success" ||
                "${{ needs.community-bot-test.result }}" != "success" ||
                "${{ needs.protocol-contract.result }}" != "success" ||
                "${{ needs.dj-phase0-containment.result }}" != "success" ||
                "${{ needs.python-sast.result }}" != "success" ||
                "${{ needs.python-audit.result }}" != "success" ||
                "${{ needs.java-audit.result }}" != "success" ||
                "${{ needs.java-plugin-audit.result }}" != "success" ||
                "${{ needs.npm-audit.result }}" != "success" ||
                "${{ needs.rust-audit.result }}" != "success" ||
                "${{ needs.license-check.result }}" != "success" ||
                "${{ needs.sbom.result }}" != "success" ||
                "${{ needs.checksums.result }}" != "success" ]]; then
            echo "One or more required CI jobs did not succeed."
            exit 1
          fi
          echo "All required CI checks passed."

      - name: Report required results
        if: always()
        run: |
          echo "### Required CI Job Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-|-|" >> $GITHUB_STEP_SUMMARY
          echo "| Python lint | ${{ needs.python-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Fabric build | ${{ needs.java-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Paper build | ${{ needs.java-plugin-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Paper 26.2 integration | ${{ needs.paper-26-2-integration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Site build | ${{ needs.site-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Coordinator tests | ${{ needs.coordinator-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| VJ server tests | ${{ needs.vj-server-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| DJ client tests | ${{ needs.dj-client-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Community bot tests | ${{ needs.community-bot-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Protocol contract | ${{ needs.protocol-contract.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| DJ Phase 0 containment | ${{ needs.dj-phase0-containment.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Bandit SAST | ${{ needs.python-sast.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| pip-audit | ${{ needs.python-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Fabric dependency-check | ${{ needs.java-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Paper dependency-check | ${{ needs.java-plugin-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| npm audit | ${{ needs.npm-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| cargo-audit | ${{ needs.rust-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| License | ${{ needs.license-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SBOM | ${{ needs.sbom.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Checksums | ${{ needs.checksums.result }} |" >> $GITHUB_STEP_SUMMARY
