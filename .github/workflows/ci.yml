name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Python: lint + test
  # ---------------------------------------------------------------------------
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install "ruff>=0.1.0,<1"

      - name: Ruff check
        run: ruff check vj_server/

      - name: Ruff format check
        run: ruff format --check vj_server/

  # ---------------------------------------------------------------------------
  # Python: security static analysis (Bandit)
  # ---------------------------------------------------------------------------
  python-sast:
    name: Python SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run Bandit
        run: |
          set +e
          bandit -r vj_server/ -c pyproject.toml -f json -o bandit-report.json
          audit_status=$?
          set -e
          if [ -f bandit-report.json ]; then
            cat bandit-report.json
          fi
          exit "$audit_status"

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report-${{ github.sha }}
          path: bandit-report.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Python: dependency audit (pip-audit)
  # ---------------------------------------------------------------------------
  python-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "vj_server/[full]" -e "coordinator/[dev]" pip-audit

      - name: Run pip-audit
        run: |
          set +e
          pip-audit --desc --local --format json --output pip-audit-report.json
          audit_status=$?
          set -e
          if [ -f pip-audit-report.json ]; then
            cat pip-audit-report.json
          fi
          exit "$audit_status"

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-report-${{ github.sha }}
          path: pip-audit-report.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Java: build Fabric mod
  # ---------------------------------------------------------------------------
  java-build:
    name: Java Build (Fabric Mod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build with Gradle
        working-directory: minecraft_mod
        run: ./gradlew build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: audioviz-mod-${{ github.sha }}
          path: minecraft_mod/build/libs/audioviz-mod-*.jar
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Java: build Paper plugin
  # ---------------------------------------------------------------------------
  java-plugin-build:
    name: Java Build (Paper Plugin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: minecraft_plugin
        run: ./mvnw package -q

      - name: Run tests with coverage
        working-directory: minecraft_plugin
        run: ./mvnw test -q

      - name: Generate JaCoCo coverage report
        working-directory: minecraft_plugin
        if: always()
        run: ./mvnw jacoco:report -q

      - name: Print coverage summary
        working-directory: minecraft_plugin
        if: always()
        run: |
          if [ -f target/site/jacoco/index.html ]; then
            echo "### Java Coverage Report" >> $GITHUB_STEP_SUMMARY
            echo "JaCoCo report generated at target/site/jacoco/" >> $GITHUB_STEP_SUMMARY
          fi

  # ---------------------------------------------------------------------------
  # Next.js: site build + lint
  # ---------------------------------------------------------------------------
  site-build:
    name: Site Build (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Lint
        working-directory: site
        run: npm run lint

      - name: Run tests
        working-directory: site
        run: npm run test --if-present

      - name: Build
        working-directory: site
        run: npm run build

  # ---------------------------------------------------------------------------
  # Coordinator: Python lint + test
  # ---------------------------------------------------------------------------
  coordinator-test:
    name: Coordinator Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install "ruff>=0.1.0,<1"

      - name: Ruff check coordinator
        run: ruff check coordinator/

      - name: Ruff format check coordinator
        run: ruff format --check coordinator/

      - name: Install coordinator dependencies
        working-directory: coordinator
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install pytest-cov
        run: pip install pytest-cov

      - name: Run coordinator tests with coverage
        working-directory: coordinator
        run: pytest tests/ -v --tb=short -p no:cacheprovider --cov=app --cov-report=term-missing --cov-fail-under=60

  # ---------------------------------------------------------------------------
  # VJ server: Python tests
  # ---------------------------------------------------------------------------
  vj-server-test:
    name: VJ Server Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install VJ dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "vj_server/[full]" pytest pytest-asyncio pytest-timeout pytest-cov

      - name: Run VJ server tests with coverage
        run: pytest vj_server/tests -v --tb=short --timeout=60 --timeout-method=signal -p no:cacheprovider --cov=vj_server --cov-report=term-missing --cov-fail-under=15

  # ---------------------------------------------------------------------------
  # DJ Client: Rust tests + web build
  # ---------------------------------------------------------------------------
  dj-client-test:
    name: DJ Client Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dj_client/package-lock.json

      - name: Install system dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install DJ client dependencies
        working-directory: dj_client
        run: npm ci

      - name: Build DJ client frontend
        working-directory: dj_client
        run: npm run build

      - name: Run DJ client frontend tests
        working-directory: dj_client
        run: npm test -- --watch=false

      - name: Run Rust backend tests
        working-directory: dj_client/src-tauri
        run: cargo test

  # ---------------------------------------------------------------------------
  # Java: dependency verification (Gradle)
  # ---------------------------------------------------------------------------
  java-audit:
    name: Java Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Verify dependencies
        working-directory: minecraft_mod
        run: ./gradlew dependencies --configuration runtimeClasspath

  # ---------------------------------------------------------------------------
  # Node.js: npm audit (root + dj_client)
  # ---------------------------------------------------------------------------
  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit root package
        run: |
          npm ci --ignore-scripts
          set +e
          npm audit --audit-level=high --json > npm-audit-root.json
          audit_status=$?
          set -e
          cat npm-audit-root.json
          exit "$audit_status"

      - name: Audit dj_client package
        if: always()
        working-directory: dj_client
        run: |
          npm ci --ignore-scripts
          set +e
          npm audit --audit-level=high --json > npm-audit-djclient.json
          audit_status=$?
          set -e
          cat npm-audit-djclient.json
          exit "$audit_status"

      - name: Audit site package
        if: always()
        working-directory: site
        run: |
          npm ci --ignore-scripts
          set +e
          npm audit --audit-level=high --json > npm-audit-site.json
          audit_status=$?
          set -e
          cat npm-audit-site.json
          exit "$audit_status"

      - name: Audit worker package
        if: always()
        working-directory: worker
        run: |
          npm ci --ignore-scripts
          set +e
          npm audit --audit-level=high --json > npm-audit-worker.json
          audit_status=$?
          set -e
          cat npm-audit-worker.json
          exit "$audit_status"

      - name: Upload npm audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-reports-${{ github.sha }}
          path: |
            npm-audit-root.json
            dj_client/npm-audit-djclient.json
            site/npm-audit-site.json
            worker/npm-audit-worker.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # License compliance check
  # ---------------------------------------------------------------------------
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e "vj_server/[full]" -e "coordinator/[dev]" pip-licenses

      - name: Python license check
        run: |
          echo "### Python Dependency Licenses" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          pip-licenses --format=markdown --with-urls >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          # Fail on copyleft licenses that are incompatible with MIT
          pip-licenses --fail-on="GPL-2.0;GPL-3.0;AGPL-3.0;LGPL-2.0;LGPL-2.1;LGPL-3.0"

      - name: Java dependency licenses
        working-directory: minecraft_mod
        run: |
          echo "### Java Dependency Licenses (Gradle)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ./gradlew dependencies --configuration runtimeClasspath >> $GITHUB_STEP_SUMMARY 2>&1
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Rust: cargo-audit (DJ Client / Tauri)
  # ---------------------------------------------------------------------------
  rust-audit:
    name: Rust Dependency Audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo-audit
        working-directory: dj_client/src-tauri
        run: |
          set +e
          cargo audit --json --deny warnings > cargo-audit-report.json
          audit_status=$?
          set -e
          cat cargo-audit-report.json
          exit "$audit_status"

      - name: Upload cargo-audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-audit-report-${{ github.sha }}
          path: dj_client/src-tauri/cargo-audit-report.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # SBOM generation (CycloneDX)
  # ---------------------------------------------------------------------------
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: [java-build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps + CycloneDX
        run: |
          python -m pip install --upgrade pip
          pip install -e "vj_server/[full]" -e "coordinator/[dev]" cyclonedx-bom

      - name: Generate Python SBOM
        run: cyclonedx-py environment -o sbom-python.json --output-format json

      - name: Upload SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom-python.json
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Checksums for release artifacts
  # ---------------------------------------------------------------------------
  checksums:
    name: Generate Checksums
    runs-on: ubuntu-latest
    needs: [java-build]
    steps:
      - name: Download mod JAR
        uses: actions/download-artifact@v8
        with:
          name: audioviz-mod-${{ github.sha }}
          path: ./artifacts/

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          echo "### Artifact Checksums" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat SHA256SUMS.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload checksums
        uses: actions/upload-artifact@v7
        with:
          name: checksums-${{ github.sha }}
          path: artifacts/SHA256SUMS.txt
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Summary gate -- all required checks must pass
  # ---------------------------------------------------------------------------
  ci-passed:
    name: CI Passed
    if: always()
    needs: [python-lint, java-build, java-plugin-build, site-build, coordinator-test, vj-server-test, dj-client-test, python-sast, python-audit, java-audit, npm-audit, rust-audit, license-check, sbom, checksums]
    runs-on: ubuntu-latest
    steps:
      - name: Check required results
        run: |
          if [[ "${{ needs.python-lint.result }}" != "success" ||
                "${{ needs.java-build.result }}" != "success" ||
                "${{ needs.java-plugin-build.result }}" != "success" ||
                "${{ needs.site-build.result }}" != "success" ||
                "${{ needs.coordinator-test.result }}" != "success" ||
                "${{ needs.vj-server-test.result }}" != "success" ||
                "${{ needs.dj-client-test.result }}" != "success" ||
                "${{ needs.python-sast.result }}" != "success" ||
                "${{ needs.python-audit.result }}" != "success" ||
                "${{ needs.java-audit.result }}" != "success" ||
                "${{ needs.npm-audit.result }}" != "success" ||
                "${{ needs.rust-audit.result }}" != "success" ||
                "${{ needs.license-check.result }}" != "success" ||
                "${{ needs.sbom.result }}" != "success" ||
                "${{ needs.checksums.result }}" != "success" ]]; then
            echo "One or more required CI jobs did not succeed."
            exit 1
          fi
          echo "All required CI checks passed."

      - name: Report required results
        if: always()
        run: |
          echo "### Required CI Job Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-|-|" >> $GITHUB_STEP_SUMMARY
          echo "| Python lint | ${{ needs.python-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Fabric build | ${{ needs.java-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Paper build | ${{ needs.java-plugin-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Site build | ${{ needs.site-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Coordinator tests | ${{ needs.coordinator-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| VJ server tests | ${{ needs.vj-server-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| DJ client tests | ${{ needs.dj-client-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Bandit SAST | ${{ needs.python-sast.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| pip-audit | ${{ needs.python-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Java dependencies | ${{ needs.java-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| npm audit | ${{ needs.npm-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| cargo-audit | ${{ needs.rust-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| License | ${{ needs.license-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SBOM | ${{ needs.sbom.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Checksums | ${{ needs.checksums.result }} |" >> $GITHUB_STEP_SUMMARY
