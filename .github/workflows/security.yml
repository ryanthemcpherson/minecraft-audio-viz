name: Security Scan

on:
  # Run weekly on Monday at 6am UTC
  schedule:
    - cron: '0 6 * * 1'
  # Also run on-demand
  workflow_dispatch:
  # Required by the release gate on the exact main-branch commit being tagged
  push:
    branches: [main]
  # Required status check for every pull request targeting main
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Python: pip-audit with detailed output
  # ---------------------------------------------------------------------------
  python-security:
    name: Python Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e "./vj_server[full]"
          pip install -e "./coordinator[dev]"

      - name: pip-audit (JSON report)
        run: |
          set +e
          pip-audit --desc --local --format json --output pip-audit-report.json
          audit_status=$?
          set -e
          if [ -f pip-audit-report.json ]; then
            cat pip-audit-report.json
          fi
          exit "$audit_status"

      - name: Install community_bot audit dependencies
        if: always()
        run: |
          python -m venv .audit-venvs/community-bot
          .audit-venvs/community-bot/bin/python -m pip install --upgrade pip
          .audit-venvs/community-bot/bin/python -m pip install -e "./community_bot[dev]" pip-audit

      - name: community_bot pip-audit (JSON report)
        if: always()
        run: |
          set +e
          .audit-venvs/community-bot/bin/python -m pip_audit --desc --local --format json --output community-bot-pip-audit-report.json
          audit_status=$?
          set -e
          if [ -f community-bot-pip-audit-report.json ]; then
            cat community-bot-pip-audit-report.json
          fi
          exit "$audit_status"

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pip-audit-report
          path: |
            pip-audit-report.json
            community-bot-pip-audit-report.json
          retention-days: 30
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Java: OWASP dependency checks (Paper + Fabric)
  # ---------------------------------------------------------------------------
  java-security:
    name: Paper OWASP Dependency-Check
    runs-on: ubuntu-latest
    env:
      DEPENDENCY_CHECK_DATA_DIR: ${{ github.workspace }}/.dependency-check-data
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Restore NVD data cache
        id: nvd-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DEPENDENCY_CHECK_DATA_DIR }}
          key: owasp-dependency-check-12.2.2-${{ runner.os }}-${{ github.run_id }}-paper
          restore-keys: |
            owasp-dependency-check-12.2.2-${{ runner.os }}-

      - name: Run Paper OWASP Dependency-Check
        id: dependency-check
        working-directory: minecraft_plugin
        run: |
          nvd_args=()
          if [[ -n "${NVD_API_KEY:-}" ]]; then
            nvd_args+=("-DnvdApiKeyEnvironmentVariable=NVD_API_KEY")
          fi
          set +e
          ./mvnw -B \
            org.owasp:dependency-check-maven:12.2.2:check \
            -DfailBuildOnCVSS=0 \
            -DfailOnError=true \
            -DskipProvidedScope=true \
            -DhostedSuppressionsEnabled=false \
            -Dformats=JSON,SARIF \
            -DdataDirectory="$DEPENDENCY_CHECK_DATA_DIR" \
            -Dodc.outputDirectory=target/dependency-check \
            "${nvd_args[@]}"
          audit_status=$?
          set -e
          if [[ -f target/dependency-check/dependency-check-report.json &&
                -f target/dependency-check/dependency-check-report.sarif ]]; then
            echo "reports-generated=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$audit_status"

      - name: Save NVD data cache
        if: always() && steps.dependency-check.outputs.reports-generated == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DEPENDENCY_CHECK_DATA_DIR }}
          key: ${{ steps.nvd-cache.outputs.cache-primary-key }}

      - name: Upload dependency-check reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: paper-dependency-check-${{ github.sha }}
          path: |
            minecraft_plugin/target/dependency-check/dependency-check-report.json
            minecraft_plugin/target/dependency-check/dependency-check-report.sarif
          retention-days: 30
          if-no-files-found: warn

  fabric-java-security:
    name: Fabric OWASP Dependency-Check
    runs-on: ubuntu-latest
    env:
      DEPENDENCY_CHECK_DATA_DIR: ${{ github.workspace }}/.dependency-check-data
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Restore NVD data cache
        id: nvd-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DEPENDENCY_CHECK_DATA_DIR }}
          key: owasp-dependency-check-12.2.2-${{ runner.os }}-${{ github.run_id }}-fabric
          restore-keys: |
            owasp-dependency-check-12.2.2-${{ runner.os }}-

      - name: Run Fabric OWASP Dependency-Check
        id: dependency-check
        working-directory: minecraft_mod
        run: |
          set +e
          ./gradlew dependencyCheckAnalyze
          audit_status=$?
          set -e
          if [[ -f build/reports/dependency-check/dependency-check-report.json &&
                -f build/reports/dependency-check/dependency-check-report.sarif ]]; then
            echo "reports-generated=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$audit_status"

      - name: Save NVD data cache
        if: always() && steps.dependency-check.outputs.reports-generated == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DEPENDENCY_CHECK_DATA_DIR }}
          key: ${{ steps.nvd-cache.outputs.cache-primary-key }}

      - name: Upload dependency-check reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fabric-dependency-check-${{ github.sha }}
          path: |
            minecraft_mod/build/reports/dependency-check/dependency-check-report.json
            minecraft_mod/build/reports/dependency-check/dependency-check-report.sarif
          retention-days: 30
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Node.js: npm audit
  # ---------------------------------------------------------------------------
  npm-security:
    name: npm Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Audit root package
        run: |
          npm ci --ignore-scripts
          set +e
          npm audit --audit-level=high --json > npm-audit-root.json
          audit_status=$?
          set -e
          cat npm-audit-root.json
          exit "$audit_status"

      - name: Audit dj_client package
        if: always()
        working-directory: dj_client
        run: |
          npm ci --ignore-scripts
          set +e
          npm audit --audit-level=high --json > npm-audit-djclient.json
          audit_status=$?
          set -e
          cat npm-audit-djclient.json
          exit "$audit_status"

      - name: Audit site package
        if: always()
        working-directory: site
        run: |
          npm ci --ignore-scripts
          set +e
          npm audit --audit-level=high --json > npm-audit-site.json
          audit_status=$?
          set -e
          cat npm-audit-site.json
          exit "$audit_status"

      - name: Audit worker package
        if: always()
        working-directory: worker
        run: |
          npm ci --ignore-scripts
          set +e
          npm audit --audit-level=high --json > npm-audit-worker.json
          audit_status=$?
          set -e
          cat npm-audit-worker.json
          exit "$audit_status"

      - name: Upload npm audit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-audit-reports
          path: |
            npm-audit-root.json
            dj_client/npm-audit-djclient.json
            site/npm-audit-site.json
            worker/npm-audit-worker.json
          retention-days: 30
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Rust: cargo-audit (DJ Client / Tauri)
  # ---------------------------------------------------------------------------
  rust-security:
    name: Rust Security Audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: cargo-audit (JSON report)
        working-directory: dj_client/src-tauri
        run: |
          set +e
          cargo audit --json > cargo-audit-report.json
          audit_status=$?
          set -e
          cat cargo-audit-report.json
          exit "$audit_status"

      - name: Upload cargo-audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cargo-audit-report
          path: dj_client/src-tauri/cargo-audit-report.json
          retention-days: 30
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Summary
  # ---------------------------------------------------------------------------
  security-summary:
    name: Security Summary
    if: always()
    needs: [python-security, java-security, fabric-java-security, npm-security, rust-security]
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "### Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Ecosystem | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-|-|" >> $GITHUB_STEP_SUMMARY
          echo "| Python (pip-audit) | ${{ needs.python-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Paper dependency-check | ${{ needs.java-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Fabric dependency-check | ${{ needs.fabric-java-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| npm | ${{ needs.npm-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rust (cargo-audit) | ${{ needs.rust-security.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Check required results
        run: |
          if [[ "${{ needs.python-security.result }}" != "success" ||
                "${{ needs.java-security.result }}" != "success" ||
                "${{ needs.fabric-java-security.result }}" != "success" ||
                "${{ needs.npm-security.result }}" != "success" ||
                "${{ needs.rust-security.result }}" != "success" ]]; then
            echo "One or more required security jobs did not succeed."
            exit 1
          fi
          echo "All required security checks passed."
