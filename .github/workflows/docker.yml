name: Docker Validation (Phase 0 Quarantined)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'vj_server/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/docker.yml'

permissions:
  contents: read

jobs:
  build:
    name: Validate Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: audioviz-test:phase0-validation
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: docker run --rm audioviz-test:phase0-validation python -c "from vj_server import vj_server; print('OK')"
