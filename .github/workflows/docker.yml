name: Docker Validation (Phase 0 Quarantined)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'vj_server/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/docker.yml'

permissions:
  contents: read

jobs:
  build:
    name: Validate Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: audioviz-test:phase0-validation
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: docker run --rm audioviz-test:phase0-validation python -c "from vj_server import vj_server; print('OK')"
