version: 2
updates:
  # Python (pip) dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      vj-python:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "python"

  # Java (Maven) dependencies
  - package-ecosystem: "maven"
    directory: "/minecraft_plugin"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      paper-runtime:
        patterns:
          - "io.papermc.paper:*"
          - "org.java-websocket:*"
          - "com.google.code.gson:*"
          - "de.maxhenkel.voicechat:*"
      paper-test-build:
        patterns:
          - "org.junit.*:*"
          - "org.mockito:*"
          - "org.mockbukkit.mockbukkit:*"
          - "org.jacoco:*"
          - "org.apache.maven.plugins:*"
          - "net.bytebuddy:*"
    labels:
      - "dependencies"
      - "java"

  # npm - root frontend
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      root-production:
        dependency-type: "production"
      root-development:
        dependency-type: "development"
    labels:
      - "dependencies"
      - "javascript"

  # npm - DJ client (Tauri app)
  - package-ecosystem: "npm"
    directory: "/dj_client"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      dj-client-production:
        dependency-type: "production"
      dj-client-development:
        dependency-type: "development"
    labels:
      - "dependencies"
      - "javascript"

  # Rust (Cargo) - DJ client Tauri backend
  - package-ecosystem: "cargo"
    directory: "/dj_client/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      dj-rust:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "rust"

  # pip - coordinator
  - package-ecosystem: "pip"
    directory: "/coordinator"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      coordinator-python:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "python"

  # npm - site (Next.js)
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      site-production:
        dependency-type: "production"
      site-development:
        dependency-type: "development"
    labels:
      - "dependencies"
      - "javascript"

  # npm - worker (Cloudflare)
  - package-ecosystem: "npm"
    directory: "/worker"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      worker-production:
        dependency-type: "production"
      worker-development:
        dependency-type: "development"
    labels:
      - "dependencies"
      - "javascript"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ci"
