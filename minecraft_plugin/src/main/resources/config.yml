# AudioViz Plugin Configuration

# WebSocket server settings
websocket:
  # Bind address for the WebSocket server. Only explicit loopback addresses are accepted.
  # For a remote VJ server, use an encrypted tunnel that terminates on this loopback listener.
  address: "127.0.0.1"
  # Port for the WebSocket server
  port: 8765

# Shared secret for WebSocket authentication. This authenticates a local or tunneled client;
# it never permits a plaintext non-loopback listener.
ws-secret: ""

# Default visualization settings
defaults:
  # Default entity count when initializing pools (covers all pattern recommendations)
  entity_count: 160

  # Default block material for block displays
  material: GLOWSTONE

  # Entity interpolation duration (ticks)
  interpolation_duration: 1

  # Duration a beat-driven glow remains active (milliseconds)
  glow_duration_ms: 150

  # Shortest interval allowed between beat-driven effects (milliseconds)
  beat_cooldown_min_ms: 120

  # Fraction of each BPM-derived period used as the beat cooldown
  beat_cooldown_fraction: 0.60

# Bitmap LED wall settings
bitmap:
  # Maximum total pixels (TextDisplay entities) per bitmap zone
  max_pixels_per_zone: 2000

  # Pixels per world block — controls auto-sizing resolution
  # Higher = more pixels, better fidelity, more entities
  pixels_per_block: 5

  # Adaptive merge combines uniform regions into stretched rectangles.
  # Set false for stable pixel-grid fidelity (recommended for DJ visuals).
  adaptive_merge: false

# Performance settings
performance:
  # Maximum entities per zone (block displays for Lua patterns)
  max_entities_per_zone: 256

  # Maximum concurrently configured visualization zones
  max_zones: 32

  # Maximum particles emitted by the renderer during one server tick
  max_particles_per_tick: 2000

  # Number of background threads reserved for render protocol decoding
  render_decoder_threads: 2

  # Batch update interval (ticks) - entities will be updated at most this often
  min_update_interval: 1

# Bedrock Edition support (Geyser/Floodgate)
bedrock:
  # Automatically detect Geyser and enable particle fallback
  auto_detect: true

  # Force particle fallback even without Geyser (for testing)
  force_particle_fallback: false

  # Particle quality for Bedrock players (1-5, higher = more particles)
  particle_quality: 3

  # Particle size multiplier for Bedrock (Bedrock renders particles smaller)
  particle_size: 1.8

  # Maximum distance (blocks) to send particles to Bedrock players
  max_render_distance: 48
