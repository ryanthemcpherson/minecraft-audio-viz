[package]
name = "mcav-runtime-slice"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
mlua = { version = "0.11.6", features = ["lua54", "vendored"] }
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.29"

[profile.release]
opt-level = 3
