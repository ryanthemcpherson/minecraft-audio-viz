    { name = "bcrypt" },
    { name = "better-profanity" },
    { name = "lupa" },
    { name = "msgspec" },
    { name = "numpy" },
    { name = "python-dotenv" },
    { name = "websockets" },
]

[package.optional-dependencies]
fast = [
    { name = "uvloop", marker = "sys_platform != 'win32'" },
]
full = [
    { name = "aalink" },
    { name = "uvloop", marker = "sys_platform != 'win32'" },
]
link = [
    { name = "aalink" },
]
release = [
    { name = "cryptography" },
]

[package.dev-dependencies]
dev = [
    { name = "pytest" },
    { name = "pytest-asyncio" },
    { name = "pytest-cov" },
    { name = "pytest-timeout" },
]

[package.metadata]
requires-dist = [
    { name = "aalink", marker = "extra == 'full'", specifier = ">=0.1" },
    { name = "aalink", marker = "extra == 'link'", specifier = ">=0.1" },
    { name = "bcrypt", specifier = ">=4.0.0" },
    { name = "better-profanity", specifier = ">=0.7.0" },
    { name = "cryptography", marker = "extra == 'release'", specifier = "==46.0.3" },
    { name = "lupa", specifier = ">=1.14" },
    { name = "msgspec", specifier = ">=0.18.0" },
    { name = "numpy", specifier = ">=1.24.0" },
    { name = "python-dotenv", specifier = ">=1.0.0" },
    { name = "uvloop", marker = "sys_platform != 'win32' and extra == 'fast'", specifier = ">=0.19.0" },
    { name = "uvloop", marker = "sys_platform != 'win32' and extra == 'full'", specifier = ">=0.19.0" },
    { name = "websockets", specifier = ">=12.0,<17.0" },
]
provides-extras = ["fast", "link", "full", "release"]

[package.metadata.requires-dev]
dev = [
    { name = "pytest", specifier = ">=9.0" },
    { name = "pytest-asyncio", specifier = ">=1.0" },
    { name = "pytest-cov", specifier = ">=6.0" },
    { name = "pytest-timeout", specifier = ">=2.0" },
]

